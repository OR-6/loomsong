<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="description" content="A tiny toy loom on your real desk, in mixed reality. Lift the levers, slide Pip the bird across, and every picture you weave sings and comes alive as a felt plush. Hands only." />
    <meta property="og:title" content="Loomsong" />
    <meta property="og:description" content="A tiny toy loom on your real desk. Hands only. Every picture you weave sings and comes alive." />
    <meta property="og:image" content="./site/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2b3a67" />
    <title>Loomsong</title>
    <style>
      @font-face { font-family: 'Lilita One'; src: url('./fonts/LilitaOne-Regular.ttf') format('truetype'); font-display: swap; }
      @font-face { font-family: 'Fraunces'; src: url('./fonts/Fraunces-SoftSemiBold.ttf') format('truetype'); font-display: swap; }
      :root {
        --felt: #2b3a67; --felt-deep: #223057; --wood: #e0a96c; --wood-dark: #c48a4f; --walnut: #6b3e26; --walnut-deep: #4a2a18;
        --paper: #fbf1dc; --ink: #3b2a20; --tomato: #e8553e; --mustard: #f2b632; --teal: #11796d; --cream: #f3e6cc;
        --display: 'Lilita One', system-ui, sans-serif;
        --serif: 'Fraunces', Georgia, serif;
      }
      html, body { margin: 0; height: 100%; background: var(--walnut-deep); color: var(--paper);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #scene-container { position: fixed; inset: 0; }
      /* the walnut desk the loom sits on */
      #landing { position: fixed; inset: 0; overflow: auto; padding: 22px 16px 40px; box-sizing: border-box;
        background:
          repeating-linear-gradient(178deg, #0000 0 38px, #ffffff08 38px 40px, #0000 40px 95px, #00000014 95px 97px),
          linear-gradient(180deg, #5c3520, #4a2a18); }
      #landing *, #landing *::before, #landing *::after { box-sizing: border-box; }

      /* the honey-wood loom frame, with a spool on each corner post */
      #landing .frame { position: relative; max-width: 1120px; margin: 0 auto; padding: 22px; border-radius: 26px;
        background:
          repeating-linear-gradient(90deg, #0000 0 34px, #ffffff12 34px 36px, #0000 36px 77px, #0000000f 77px 78px),
          linear-gradient(180deg, var(--wood), var(--wood-dark));
        box-shadow: 0 10px 0 #8a5a33, 0 24px 50px #000a; }
      /* side-on yarn spools on the corner posts: wooden ends, wound yarn between */
      #landing .spool { --yarn: var(--tomato); position: absolute; width: 40px; height: 50px; z-index: 1;
        background:
          radial-gradient(50% 5px at 50% 4px, #c98f55 98%, #0000) top / 100% 9px no-repeat,
          radial-gradient(50% 5px at 50% 5px, #b5793f 98%, #0000) bottom / 100% 10px no-repeat,
          repeating-linear-gradient(170deg, #0000 0 3px, #00000022 3px 4px),
          linear-gradient(90deg, #0000 8%, var(--yarn) 10% 90%, #0000 92%) center / 100% 70% no-repeat;
        filter: drop-shadow(0 3px 0 #0004); }
      #landing .spool.tr, #landing .spool.bl { --yarn: #1fb3a0; }
      #landing .tl { top: -26px; left: 4px; } #landing .tr { top: -26px; right: 4px; }
      #landing .bl { bottom: -24px; left: 4px; } #landing .br { bottom: -24px; right: 4px; }

      /* the navy felt bed */
      #landing .felt { border-radius: 14px; padding: clamp(22px, 4vw, 48px);
        background:
          var(--felt-noise, none),
          radial-gradient(120% 90% at 50% 0%, #34457a, var(--felt) 60%, #24315a);
        box-shadow: inset 0 4px 12px #0006; display: flex; flex-direction: column; gap: 44px; }

      /* photos pinned to the felt with a wooden clothes peg */
      #landing .photo { position: relative; margin: 0; background: #fffaf0; padding: 8px 8px 10px; border-radius: 3px;
        box-shadow: 0 2px 2px #0006, 0 12px 18px -6px #000a; }
      /* masking tape: paper things are taped, photos are pegged */
      #landing .tape { position: absolute; z-index: 3; top: -11px; left: 50%; width: 74px; height: 22px; margin-left: -37px;
        background: linear-gradient(90deg, #0000 0 2px, #fff3d0b0 2px calc(100% - 2px), #0000 0), #fff3d0b0;
        box-shadow: 0 1px 1px #0002; transform: rotate(-4deg); }
      #landing .tape::before, #landing .tape::after { content: ''; position: absolute; top: 0; bottom: 0; width: 4px;
        background: repeating-linear-gradient(180deg, #0000 0 3px, var(--felt) 3px 5px); opacity: .35; }
      #landing .tape::before { left: 0; } #landing .tape::after { right: 0; }
      /* photos hang from their yarn (src/ui/hang.ts sets --hang so each peg grips the string) and swing on the peg */
      #landing [data-hang] { position: relative; top: var(--hang, 0px); }
      #landing .photo { rotate: var(--swing, 0deg); }
      #landing .photo img, #landing .photo video { display: block; width: 100%; height: auto; border-radius: 2px; }
      #landing .photo figcaption { font: 600 12px/1.3 var(--serif); color: #6b5a4e; padding: 7px 2px 0; }
      #landing .photo .cap-tag { position: absolute; right: 14px; bottom: -16px; padding: 5px 12px 6px 20px; background: var(--mustard); color: var(--ink);
        font: 600 13px var(--serif); transform: rotate(-2deg); box-shadow: 0 3px 0 #0003;
        clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
      #landing .peg { position: absolute; top: -18px; left: 50%; width: 16px; height: 40px; margin-left: -8px; border-radius: 4px; z-index: 2;
        background: linear-gradient(90deg, #d9a066 0 45%, #b5793f 45% 55%, #d9a066 55%); box-shadow: 0 3px 0 #0003; }
      #landing .peg::after { content: ''; position: absolute; left: 3px; right: 3px; top: 16px; height: 6px; border-radius: 3px; background: #8b8b8b; }

      /* the name on a felt plate screwed to the loom's top rail */
      #landing .rail { display: flex; justify-content: center; margin: -4px 0 18px; }
      #landing .plate { position: relative; display: inline-flex; padding: 12px 34px 14px; border-radius: 12px;
        background: var(--felt-noise, none), var(--felt-deep); box-shadow: inset 0 2px 5px #0008, 0 1px 0 #ffffff40; }
      #landing .plate::before, #landing .plate::after { content: ''; position: absolute; top: 50%; width: 13px; height: 13px; margin-top: -6.5px; border-radius: 50%;
        background: linear-gradient(35deg, #0000 44%, #6b4a14 44% 58%, #0000 58%), radial-gradient(circle at 35% 35%, #f6dca0, #b8892e); box-shadow: 0 1px 1px #0006; }
      #landing .plate::before { left: 12px; } #landing .plate::after { right: 12px; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      /* hero: the pitch, and the real loom photo */
      /* the gameplay clip is the centrepiece; the pitch is a taped card overlapping its corner */
      #landing .hero { position: relative; display: grid; padding-bottom: 46px; }
      #landing .hero-photo { width: min(100%, 860px); justify-self: end; margin-top: 10px; }
      #landing .hero-photo { transform: rotate(1.6deg); }
      #landing .pitch { position: absolute; z-index: 5; left: -6px; bottom: -14px; width: min(42%, 440px); padding: 26px 28px 24px; color: var(--ink);
        background: #fbf3e0; border-radius: 2px; transform: rotate(-1.6deg); box-shadow: 0 1px 2px #0004, 0 14px 24px -10px #000a; }
      #landing .pitch #tagline { color: var(--walnut); }
      #landing .pitch .lede { color: #4a3426; }
      #landing .pitch .note { color: #6b5a4e; }
      #landing .pitch .nohead { background: #f1e3c6; box-shadow: none; transform: none; margin-top: 4px; }
      #landing .pitch .nohead .tape { display: none; }
      #landing .mark { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
      /* the living mark: a little loom weaving on the nameplate (canvas, src/ui/weave-mark.ts) */
      #landing .weave-mark { flex: none; width: 150px; height: 132px; margin: -8px 0 -10px; }
      #landing .weave-canvas { display: block; }

      #landing h1 { font-family: var(--display); font-weight: 400; font-size: clamp(46px, 5vw, 70px); line-height: .95; margin: 0;
        color: var(--mustard); text-shadow: 0 5px 0 var(--walnut); }
      #landing #tagline { font-family: var(--display); font-size: clamp(21px, 2.3vw, 27px); line-height: 1.15; margin: 0 0 12px; color: var(--paper); text-wrap: balance; }
      #landing .lede { text-wrap: pretty; font: 600 17px/1.6 var(--serif); margin: 0 0 24px; max-width: 32em; color: #e8ddc8; }
      #landing .note { font: 600 14px/1.5 var(--serif); margin: 12px 0 0; max-width: 34em; color: #c9c5d8; }
      /* buttons are felt patches with a running stitch, like the felt on the loom */
      #landing .patch { position: relative; border: 0; cursor: pointer; color: #fff6e8;
        background: var(--felt-noise, none), var(--patch, var(--tomato)); border-radius: 16px;
        box-shadow: 0 2px 2px #0005, 0 10px 16px -6px #0008; transition: transform .08s, box-shadow .08s; }
      #landing .patch::after { content: ''; position: absolute; inset: 5px; border: 2px dashed #fff3e0a6; border-radius: 11px; pointer-events: none; }
      #landing .patch:active { transform: translateY(2px); box-shadow: 0 1px 1px #0005; }
      #enter-xr { font-family: var(--display); font-size: 26px; padding: 18px 36px 19px; }
      #landing .nohead { position: relative; background: var(--paper); color: var(--ink); border-radius: 3px; padding: 22px 20px 18px; max-width: 30em;
        box-shadow: 0 1px 2px #0003, 0 6px 12px -6px #0005; transform: rotate(-.8deg); margin-top: 22px; }
      #landing .nohead[hidden] { display: none; }
      #landing .nohead p { margin: 0 0 12px; font: 600 15px/1.5 var(--serif); }
      #landing .row { display: flex; gap: 8px; flex-wrap: wrap; }
      #landing .row input { width: 6.5em; text-align: center; text-transform: uppercase; letter-spacing: .2em; font: 600 17px system-ui, sans-serif;
        padding: 9px 10px; border-radius: 12px; border: 2px solid var(--walnut); background: #fff; color: var(--ink); }
      #landing .row button, #coop .row button { font: 400 18px var(--display); padding: 10px 20px 11px; --patch: var(--walnut); }
      #call-join, #coop-join { --patch: var(--tomato) !important; }
      #landing .row input, #coop-code { background: #fffaf0 !important; border: 2px solid #6b3e2699 !important; border-radius: 8px !important; box-shadow: inset 0 2px 3px #0002; }
      #style-pick { position: relative; display: flex; gap: 6px; align-items: center; background: var(--paper); color: var(--ink); padding: 8px 14px 8px 30px;
        transform: rotate(-1.2deg); clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px), 0 12px); font: 600 15px var(--serif); }
      #style-pick::before { content: ''; position: absolute; left: 12px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--felt); box-shadow: 0 0 0 2px var(--tomato); }
      #style-pick[hidden] { display: none; }
      #style-pick .lbl { margin-right: 4px; }
      #style-pick button { font: 400 16px var(--display); padding: 3px 10px; border-radius: 999px; border: 2px solid transparent; background: none; color: var(--ink); cursor: pointer; }
      #style-pick button[data-theme='workshop'] { font-family: 'Fraunces', Georgia, serif; font-weight: 600; }
      #style-pick button[aria-checked='true'] { border-color: var(--tomato); }

      /* how it plays: hand-hung photos on a sagging yarn, each with its note on a paper tag (it is a sequence) */
      #landing .line { position: relative; padding-top: 8px; }
      #landing .yarn { position: absolute; left: -10px; right: -10px; top: 0; width: calc(100% + 20px); height: 90px; }
      #landing .steps { list-style: none; margin: 0; padding: 0; display: flex; align-items: flex-start; }
      #landing .steps li { position: relative; }
      #landing .steps .s1 { flex: 1.12; margin-top: 26px; z-index: 2; }
      #landing .steps .s2 { flex: 0.86; margin: 78px 0 0 6px; z-index: 3; }
      #landing .steps .s3 { flex: 1.02; margin: 40px 0 0 18px; z-index: 1; }
      #landing .steps .s1 .photo { transform: rotate(-3.6deg); }
      #landing .steps .s2 .photo { transform: rotate(2.7deg); }
      #landing .steps .s3 .photo { transform: none; }
      #landing .steps .s1 .peg { left: 22%; }
      #landing .steps .s2 .peg { left: 63%; transform: rotate(6deg); }
      #landing .steps .s3 .peg { left: 46%; transform: rotate(-4deg); }
      #landing .steps img { aspect-ratio: 4 / 3; object-fit: cover; }
      /* the step's note on a paper luggage tag tucked under its photo */
      #landing .hang { position: relative; z-index: 4; width: min(100%, 280px); margin: -22px 0 0 16px; padding: 12px 16px 13px 22px;
        font: 600 14.5px/1.5 var(--serif); color: var(--ink); background: var(--paper); box-shadow: 0 1px 2px #0004; transform: rotate(1.6deg);
        clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px), 0 12px); text-wrap: pretty; }
      #landing .hang::before { display: none; content: ''; position: absolute; left: 11px; top: 18px; width: 7px; height: 7px; border-radius: 50%;
        background: var(--felt); box-shadow: inset 0 1px 1px #0006; }
      #landing .hang b { display: flex; align-items: center; gap: 8px; font: 400 19px/1.1 var(--display); color: var(--walnut); margin-bottom: 6px; }
      /* a felt patch sewn on: tomato felt, a cream running stitch inside the edge, a cream numeral */
      #landing .hang .num { display: inline-grid; place-items: center; width: 31px; height: 31px; flex: none;
        background: var(--felt-noise, none), var(--tomato); color: #fff4de; font: 400 16px var(--display);
        border-radius: 48% 52% 50% 46% / 52% 47% 53% 48%; transform: rotate(-8deg);
        outline: 1.6px dashed #fff1d6; outline-offset: -5px; box-shadow: 0 1px 0 #0003, 0 2px 4px -2px #0005; }
      #landing .s2 .hang { margin-left: auto; margin-right: 6px; transform: rotate(-2.2deg); }
      #landing .s3 .hang { margin-left: 34px; transform: none; }

      /* more on the desk */
      #landing .more { position: relative; display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: clamp(18px, 3vw, 34px); align-items: start; padding-top: 34px; }
      #landing .small-yarn { top: 4px; height: 60px; }
      #landing .more > .photo:first-of-type { margin-top: 10px; }
      #landing .more .note-card { margin-top: 30px; }
      #landing .more > .photo:last-of-type { margin-top: 0; }
      #landing .more > .photo:first-of-type { transform: rotate(-2.8deg); }
      #landing .more > .photo:last-of-type { transform: rotate(3.1deg); }
      #landing .more > .photo:first-of-type .peg { left: 28%; }
      #landing .more > .photo:last-of-type .peg { left: 66%; }
      #landing .note-card { position: relative; background: var(--paper); color: var(--ink); padding: 20px 22px 18px; border-radius: 3px; box-shadow: 0 1px 2px #0003, 0 6px 12px -6px #0005; transform: none; }
      #landing .note-card b { display: block; font: 400 22px/1.15 var(--display); color: var(--walnut); margin-bottom: 8px; }
      #landing .note-card p { margin: 0; font: 600 15px/1.6 var(--serif); text-wrap: pretty; }
      #landing .note-card .peg { left: 22%; transform: rotate(-8deg); }
      #landing .more img { aspect-ratio: 16 / 10; object-fit: cover; }
      #landing .more .label { position: absolute; z-index: 3; left: 16px; bottom: 18px; padding: 4px 12px 5px 20px; background: var(--paper); color: var(--ink);
        font: 400 15px var(--display); box-shadow: 0 1px 2px #0004; transform: rotate(-2deg);
        clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); }
      #landing .more > .photo:last-of-type img { object-position: 45% 45%; }


      #landing .drawer { display: flex; gap: clamp(20px, 4vw, 48px); align-items: center; justify-content: center; flex-wrap: wrap; }
      #landing .prep { display: flex; flex-direction: column; gap: 14px; align-items: center; }
      #share-card { margin: 0; display: flex; align-items: center; gap: 18px; }
      #share-card .pegged { position: relative; display: block; transform: rotate(-2deg); }
      #share-card figcaption b { display: block; font: 400 22px var(--display); color: var(--mustard); margin-bottom: 8px; }
      #share-card[hidden] { display: none; }
      #cloth-img { max-width: min(200px, 60vw); border-radius: 3px; border: 8px solid #fffaf0; box-shadow: 0 5px 0 #0004; image-rendering: auto; }
      #share-btn { font: 400 18px var(--display); padding: 10px 20px 11px; --patch: var(--walnut); }
      #share-note { display: block; font-size: 13px; color: #c9c5d8; max-width: 90vw; word-break: break-all; margin-top: 6px; }

      /* settings: paper luggage tags with a yarn loop, like the hints in the game */
      #landing h2.before { position: relative; margin: 0 0 6px; padding: 10px 22px 9px; font: 400 21px var(--display); color: var(--walnut);
        background: #fff3d0c8; color: var(--walnut); border-radius: 0; box-shadow: 0 1px 1px #0002; transform: rotate(-2.5deg); padding: 6px 22px 7px; }
      #settings { display: flex; flex-wrap: wrap; gap: 16px 30px; justify-content: center; align-items: center; padding-left: 20px; }
      #landing .tagwrap { position: relative; display: inline-flex; }
      #landing .tagwrap:nth-child(1) { transform: rotate(-2deg); }
      #landing .tagwrap:nth-child(2) { transform: rotate(1.5deg); }
      #landing .tagwrap:nth-child(3) { transform: rotate(-1deg); }
      /* a loop of red yarn through the punched hole */
      #landing .string { position: absolute; z-index: 2; left: -21px; top: 50%; width: 40px; height: 26px; margin-top: -13px; pointer-events: none; }
      #landing .tag::after { content: 'off'; margin-left: 10px; font: 400 14px var(--display); color: #4a3426; }
      #landing .tag[aria-checked='true']::after, #landing .tag[aria-pressed='true']::after { content: 'on'; color: var(--ink); }
      #landing .tag, #hand-pick { position: relative; font: 600 15px var(--serif); color: var(--ink); background: var(--paper);
        border: 0; padding: 9px 16px 9px 30px; cursor: pointer;
        clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px), 0 12px); }
      #landing .tag::before, #hand-pick::before { content: ''; position: absolute; left: 12px; top: 50%; width: 8px; height: 8px; margin-top: -4px;
        border-radius: 50%; background: var(--felt); box-shadow: 0 0 0 2px var(--tomato); }
      #landing .tag[aria-checked='true'], #landing .tag[aria-pressed='true'] { background: var(--mustard); }
      /* the tag shape clips outlines, so focus is drawn inside it */
      #landing .tag:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--tomato); }
      #hand-pick { display: flex; gap: 6px; align-items: center; cursor: default; transform: rotate(1deg); }
      #hand-pick .lbl { margin-right: 4px; }
      /* choices written on the tag; the chosen one is circled in yarn */
      #hand-pick button { font: 600 15px var(--serif); padding: 3px 9px; border: 2px solid transparent; border-radius: 999px; background: none; color: var(--ink); cursor: pointer; }
      #hand-pick button[aria-checked='true'] { border-color: var(--tomato); }
      #hand-pick button:focus-visible { outline: 3px solid var(--tomato); outline-offset: 1px; }

      /* play together: a paper card pegged to the felt, with the caller's phone beside it */
      #coop { position: relative; display: grid; grid-template-columns: 210px 1fr; gap: 26px; align-items: center; background: var(--paper); color: var(--ink);
        border-radius: 4px; padding: 26px 28px 22px; box-shadow: 0 1px 2px #0003, 0 8px 16px -8px #0006; max-width: 820px; width: 100%; align-self: center; transform: rotate(-.4deg); }
      #coop .phone { padding: 6px; transform: rotate(-3deg); margin: -44px 0 -10px; }
      #coop .phone img { border-radius: 14px; }
      #coop .phone .peg { left: 14%; transform: rotate(-10deg); }
      #coop h2 { text-wrap: balance; margin: 0 0 8px; font: 400 25px/1.15 var(--display); color: var(--walnut); }
      #coop p { margin: 0 0 12px; max-width: 58ch; font: 600 15px/1.55 var(--serif); }
      #coop .row { margin: 6px 0 10px; align-items: center; }
      #coop .row button, #coop-code { height: 44px; padding-top: 0; padding-bottom: 0; }
      #coop .or { font: 600 14px var(--serif); color: #6b5a4e; }

      #coop-code { width: 6.5em; text-align: center; text-transform: uppercase; letter-spacing: .2em; font: 600 17px system-ui, sans-serif;
        padding: 9px 10px; border-radius: 12px; border: 2px solid var(--walnut); background: #fff; color: var(--ink); }
      #coop-status { font-weight: 700; color: var(--walnut); margin: 0 !important; }
      #coop-status:empty { display: none; }
      #coop .fine { font: 600 13px/1.5 var(--serif); color: #6b5a4e; margin: 6px 0 0; }

      #landing .foot { display: flex; justify-content: center; margin-top: -6px; }
      #landing .slip { position: relative; margin: 0; max-width: 46em; padding: 14px 20px 13px; background: var(--paper); color: var(--ink); border-radius: 2px;
        font: 600 13.5px/1.5 var(--serif); text-align: center; box-shadow: 0 1px 1px #0002; transform: rotate(.3deg); text-wrap: balance; }
      #landing .slip a { color: var(--walnut); text-underline-offset: 3px; }
      #landing .slip a:focus-visible { outline: 3px solid var(--tomato); outline-offset: 2px; }
      #landing button:focus-visible, #landing input:focus-visible, #landing summary:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }
      @media (min-width: 1200px) { #landing .steps li { font-size: 16px; } }
      @media (max-width: 860px) {
        #landing .hero { padding-bottom: 0; }
        #landing .hero-photo { width: 100%; transform: rotate(1deg); margin-top: 6px; }
        #landing .pitch { position: relative; width: auto; margin: -34px 8px 0; transform: rotate(-1deg); }
        #landing .steps { flex-direction: column; gap: 34px; }
        #landing .steps li { margin: 16px auto 0 !important; max-width: 480px; width: 100%; }
        #landing .yarn { display: none; }
        #landing .more { grid-template-columns: 1fr 1fr; }
        #landing .more .note-card { grid-column: 1 / -1; order: -1; margin-top: 0; }
        #landing .small-yarn { display: none; }
      }
      @media (max-width: 520px) {
        #landing { padding: 14px 10px 30px; }
        #landing .frame { padding: 14px; }
