<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="description" content="A tiny toy loom on your real desk, in mixed reality. Lift the levers, slide Pip the bird across, and every picture you weave sings and comes alive as a knitted plush. Hands only." />
    <meta property="og:title" content="Loomsong" />
    <meta property="og:description" content="A tiny toy loom on your real desk. Hands only. Every picture you weave sings and comes alive." />
    <meta property="og:image" content="./site/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2b3a67" />
    <title>Loomsong</title>
    <style>
      @font-face { font-family: 'Lilita One'; src: url('./fonts/LilitaOne-Regular.ttf') format('truetype'); font-display: swap; }
      @font-face { font-family: 'Fraunces'; src: url('./fonts/Fraunces-SoftSemiBold.ttf') format('truetype'); font-display: swap; }
      :root {
        --felt: #2b3a67; --felt-deep: #223057; --wood: #e0a96c; --wood-dark: #c48a4f; --walnut: #6b3e26; --walnut-deep: #4a2a18;
        --paper: #fbf1dc; --ink: #3b2a20; --tomato: #e8553e; --mustard: #f2b632; --teal: #11796d; --cream: #f3e6cc;
        --display: 'Lilita One', system-ui, sans-serif;
        --serif: 'Fraunces', Georgia, serif;
      }
      html, body { margin: 0; height: 100%; background: var(--walnut-deep); color: var(--paper);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #scene-container { position: fixed; inset: 0; }
      /* the walnut desk the loom sits on */
      #landing { position: fixed; inset: 0; overflow: auto; padding: 22px 16px 40px; box-sizing: border-box;
        background:
          repeating-linear-gradient(178deg, #0000 0 38px, #ffffff08 38px 40px, #0000 40px 95px, #00000014 95px 97px),
          linear-gradient(180deg, #5c3520, #4a2a18); }
      #landing *, #landing *::before, #landing *::after { box-sizing: border-box; }

      /* the honey-wood loom frame, with a spool on each corner post */
      #landing .frame { position: relative; max-width: 1120px; margin: 0 auto; padding: 22px; border-radius: 26px;
        background:
          repeating-linear-gradient(90deg, #0000 0 34px, #ffffff12 34px 36px, #0000 36px 77px, #0000000f 77px 78px),
          linear-gradient(180deg, var(--wood), var(--wood-dark));
        box-shadow: 0 10px 0 #8a5a33, 0 24px 50px #000a; }
      /* side-on yarn spools on the corner posts: wooden ends, wound yarn between */
      #landing .spool { --yarn: var(--tomato); position: absolute; width: 40px; height: 50px; z-index: 1;
        background:
          radial-gradient(50% 5px at 50% 4px, #c98f55 98%, #0000) top / 100% 9px no-repeat,
          radial-gradient(50% 5px at 50% 5px, #b5793f 98%, #0000) bottom / 100% 10px no-repeat,
          repeating-linear-gradient(170deg, #0000 0 3px, #00000022 3px 4px),
          linear-gradient(90deg, #0000 8%, var(--yarn) 10% 90%, #0000 92%) center / 100% 70% no-repeat;
        filter: drop-shadow(0 3px 0 #0004); }
      #landing .spool.tr, #landing .spool.bl { --yarn: #1fb3a0; }
      #landing .tl { top: -26px; left: 4px; } #landing .tr { top: -26px; right: 4px; }
      #landing .bl { bottom: -24px; left: 4px; } #landing .br { bottom: -24px; right: 4px; }

      /* the navy felt bed */
      #landing .felt { border-radius: 14px; padding: clamp(22px, 4vw, 48px);
        background:
          var(--felt-noise, none),
          radial-gradient(120% 90% at 50% 0%, #34457a, var(--felt) 60%, #24315a);
        box-shadow: inset 0 4px 12px #0006; display: flex; flex-direction: column; gap: 44px; }

      /* photos pinned to the felt with a wooden clothes peg */
      #landing .photo { position: relative; margin: 0; background: #fffaf0; padding: 8px 8px 10px; border-radius: 3px;
        box-shadow: 0 6px 0 #0004, 0 14px 26px #0005; }
      #landing .photo img, #landing .photo video { display: block; width: 100%; height: auto; border-radius: 2px; }
      #landing .photo figcaption { font: 600 12px/1.3 var(--serif); color: #6b5a4e; padding: 7px 2px 0; }
      #landing .photo .cap-tag { position: absolute; right: 14px; bottom: -16px; padding: 5px 12px 6px 20px; background: var(--mustard); color: var(--ink);
        font: 600 13px var(--serif); transform: rotate(-2deg); box-shadow: 0 3px 0 #0003;
        clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
      #landing .peg { position: absolute; top: -18px; left: 50%; width: 16px; height: 40px; margin-left: -8px; border-radius: 4px; z-index: 2;
        background: linear-gradient(90deg, #d9a066 0 45%, #b5793f 45% 55%, #d9a066 55%); box-shadow: 0 3px 0 #0003; }
      #landing .peg::after { content: ''; position: absolute; left: 3px; right: 3px; top: 16px; height: 6px; border-radius: 3px; background: #8b8b8b; }

      /* hero: the pitch, and the real loom photo */
      #landing .hero { display: grid; grid-template-columns: minmax(340px, 1fr) 1.1fr; gap: clamp(28px, 4vw, 56px); align-items: center; }
      #landing .hero-photo { transform: rotate(1.6deg); }
      #landing .pitch { position: relative; z-index: 1; min-width: 0; }
      #landing .mark { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
      #landing .weave { --cell: 11px; --gap: 2px; position: relative; flex: none;
        width: calc(8 * var(--cell) + 7 * var(--gap) + 16px); padding: 18px 8px 8px; border-radius: 9px;
        background: var(--felt-deep); box-shadow: inset 0 2px 6px #0007; }
      #landing .weave .warps { position: absolute; inset: 0 8px; pointer-events: none;
        background: repeating-linear-gradient(90deg, #0000 0 calc((var(--cell) + var(--gap)) / 2 - 1px), #f3e6cc88 calc((var(--cell) + var(--gap)) / 2 - 1px) calc((var(--cell) + var(--gap)) / 2 + 1px), #0000 calc((var(--cell) + var(--gap)) / 2 + 1px) calc(var(--cell) + var(--gap))); }
      #landing .cloth { position: relative; display: grid; gap: var(--gap); }
      #landing .cloth .row { display: grid; grid-template-columns: repeat(8, var(--cell)); gap: var(--gap); }
      #landing .cloth i { height: calc(var(--cell) * 0.82); border-radius: 3px; opacity: 0; transform: scaleY(0.4);
        box-shadow: inset 0 -2px 0 #0002, inset 0 1px 0 #ffffff55; }
      #landing .cloth i.px { background: var(--pic); }
      #landing .cloth i.gr { background: var(--cream); }
      /* in the logo mark only the duck's own cells show: a clear little duck, not a bead grid */
      #landing .mark .warps { display: none; }
      #landing .mark .weave { background: none; box-shadow: none; padding-left: 0; padding-right: 0; }
      #landing .mark .cloth i.gr { visibility: hidden; }
      #landing .cloth .row.in i { animation: beat .3s cubic-bezier(.3, 1.6, .5, 1) forwards; }
      @keyframes beat { to { opacity: 1; transform: none; } }
      #landing .pip { position: absolute; left: 0; width: 26px; height: 23px; opacity: 0;
        top: calc(18px + var(--y, 0) * (var(--cell) * 0.82 + var(--gap)) - 15px); }
      #landing .pip.fly-r { animation: fly-r .45s ease-in-out forwards; }
      #landing .pip.fly-l { animation: fly-l .45s ease-in-out forwards; }
      @keyframes fly-r { from { opacity: 1; left: -20px; } to { opacity: 1; left: calc(100% - 6px); } }
      @keyframes fly-l { from { opacity: 1; left: calc(100% - 6px); transform: scaleX(-1); } to { opacity: 1; left: -20px; transform: scaleX(-1); } }
      #landing .pip.rest { animation: none; opacity: 1; left: calc(100% - 14px); top: -12px; transform: scaleX(-1) rotate(-4deg); }

      #landing h1 { font-family: var(--display); font-weight: 400; font-size: clamp(48px, 5.4vw, 74px); line-height: .95; margin: 0;
        color: var(--mustard); text-shadow: 0 5px 0 var(--walnut); }
      #landing #tagline { font-family: var(--display); font-size: clamp(21px, 2.3vw, 27px); line-height: 1.15; margin: 0 0 12px; color: var(--paper); text-wrap: balance; }
      #landing .lede { font: 600 17px/1.6 var(--serif); margin: 0 0 24px; max-width: 32em; color: #e8ddc8; }
      #landing .note { font: 600 14px/1.5 var(--serif); margin: 12px 0 0; max-width: 34em; color: #c9c5d8; }
      #enter-xr { font-family: var(--display); font-size: 26px; padding: 16px 34px 18px; border-radius: 18px; border: 0; cursor: pointer;
        background: var(--tomato); color: #fff6e8; box-shadow: 0 7px 0 #a8341f, 0 12px 20px #0005; transition: transform .08s, box-shadow .08s; }
      #enter-xr:active { transform: translateY(5px); box-shadow: 0 2px 0 #a8341f; }
      #landing .nohead { position: relative; background: var(--paper); color: var(--ink); border-radius: 3px; padding: 22px 20px 18px; max-width: 30em;
        box-shadow: 0 5px 0 #0003; transform: rotate(-.8deg); margin-top: 14px; }
      #landing .nohead[hidden] { display: none; }
      #landing .nohead p { margin: 0 0 12px; font: 600 15px/1.5 var(--serif); }
      #landing .row { display: flex; gap: 8px; flex-wrap: wrap; }
      #landing .row input { width: 6.5em; text-align: center; text-transform: uppercase; letter-spacing: .2em; font: 600 17px system-ui, sans-serif;
        padding: 9px 10px; border-radius: 12px; border: 2px solid var(--walnut); background: #fff; color: var(--ink); }
      #landing .row button, #coop .row button { font: 400 18px var(--display); padding: 9px 18px 11px; border-radius: 12px; border: 0; cursor: pointer;
        background: var(--walnut); color: var(--paper); box-shadow: 0 4px 0 #4a2a18; }
      #call-join { background: var(--tomato) !important; box-shadow: 0 4px 0 #a8341f !important; }
      #style-pick { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
      #style-pick[hidden] { display: none; }
      #style-pick .lbl { font: 600 14px var(--serif); color: #c9c5d8; margin-right: 4px; }
      #style-pick button { font: 400 16px var(--display); padding: 7px 16px; border-radius: 10px; border: 2px solid var(--mustard);
        background: transparent; color: var(--paper); cursor: pointer; }
      #style-pick button[data-theme='workshop'] { font-family: 'Fraunces', Georgia, serif; font-weight: 600; }
      #style-pick button[aria-checked='true'] { background: var(--mustard); color: var(--ink); }

      /* how it plays: three photos pegged to a sagging yarn line, each with its own tag (it is a sequence) */
      #landing .line { position: relative; padding-top: 8px; }
      #landing .yarn { position: absolute; left: -10px; right: -10px; top: 0; width: calc(100% + 20px); height: 90px; }
      #landing .steps { list-style: none; margin: 0; padding: 0; display: flex; gap: clamp(18px, 3vw, 36px); align-items: flex-start; }
      #landing .steps li { font: 600 15px/1.55 var(--serif); color: #e8ddc8; }
      #landing .steps .s1 { flex: 1.05; margin-top: 30px; }
      #landing .steps .s2 { flex: 0.9; margin-top: 74px; }
      #landing .steps .s3 { flex: 1.15; margin-top: 44px; }
      #landing .steps .s1 .photo { transform: rotate(-2.4deg); }
      #landing .steps .s2 .photo { transform: rotate(1.8deg); }
      #landing .steps .s3 .photo { transform: rotate(-1.1deg); }
      #landing .steps img { aspect-ratio: 4 / 3; object-fit: cover; }
      #landing .steps .s1 img { object-position: 62% 40%; }
      #landing .steps .s2 img { object-position: 78% 30%; }
      #landing .steps .s3 img { object-position: 40% 35%; }
      #landing .steps p { margin: 16px 4px 0; max-width: 30ch; }
      /* the step's name on a little paper tag hanging off its peg */
      #landing .hang { position: absolute; bottom: 16px; left: 14px; z-index: 3; font: 400 16px var(--display); color: var(--ink);
        background: var(--paper); padding: 5px 12px 6px 22px; white-space: nowrap; transform: rotate(4deg); box-shadow: 0 3px 0 #0003;
        clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); }
      #landing .hang::before { content: ''; position: absolute; left: 9px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%;
        background: var(--felt); box-shadow: 0 0 0 1.5px var(--tomato); }
      #landing .s2 .hang { left: auto; right: 14px; transform: rotate(-3deg); }

      /* more on the desk */
      #landing .more { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: clamp(18px, 3vw, 34px); align-items: center; }
      #landing .more .photo:first-child { transform: rotate(-1.5deg); }
      #landing .more .photo:last-child { transform: rotate(1.8deg); }
      #landing .note-card { background: var(--paper); color: var(--ink); padding: 20px 22px 18px; border-radius: 3px; box-shadow: 0 5px 0 #0003; transform: rotate(.7deg); }
      #landing .note-card b { display: block; font: 400 22px/1.15 var(--display); color: var(--walnut); margin-bottom: 8px; }
      #landing .note-card p { margin: 0; font: 600 15px/1.6 var(--serif); }
      #landing .more img { aspect-ratio: 4 / 3; object-fit: cover; }
      #landing .more .photo:first-child img { object-position: 50% 50%; }
      #landing .more .photo:last-child img { object-position: 45% 45%; }


      #landing .drawer { display: flex; gap: clamp(20px, 4vw, 48px); align-items: center; justify-content: center; flex-wrap: wrap; }
      #landing .prep { display: flex; flex-direction: column; gap: 14px; align-items: center; }
      #share-card { margin: 0; display: flex; align-items: center; gap: 18px; }
      #share-card .pegged { position: relative; display: block; transform: rotate(-2deg); }
      #share-card figcaption b { display: block; font: 400 22px var(--display); color: var(--mustard); margin-bottom: 8px; }
      #share-card[hidden] { display: none; }
      #cloth-img { max-width: min(200px, 60vw); border-radius: 3px; border: 8px solid #fffaf0; box-shadow: 0 5px 0 #0004; image-rendering: auto; }
      #share-btn { font: 400 18px var(--display); padding: 9px 18px 11px; border-radius: 12px; border: 0; cursor: pointer;
        background: var(--walnut); color: var(--paper); box-shadow: 0 4px 0 #4a2a18; }
      #share-note { display: block; font-size: 13px; color: #c9c5d8; max-width: 90vw; word-break: break-all; margin-top: 6px; }

      /* settings: paper luggage tags with a yarn loop, like the hints in the game */
      #landing h2.before { margin: 0; text-align: center; font: 400 22px var(--display); color: var(--mustard); }
      #settings { display: flex; flex-wrap: wrap; gap: 14px 18px; justify-content: center; align-items: center; }
      #landing .tag::after { content: 'Off'; margin-left: 10px; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: #3b2a2014; }
      #landing .tag[aria-checked='true']::after, #landing .tag[aria-pressed='true']::after { content: 'On'; background: #3b2a20; color: var(--mustard); }
      #landing .tag, #hand-pick { position: relative; font: 600 15px var(--serif); color: var(--ink); background: var(--paper);
        border: 0; padding: 9px 16px 9px 30px; cursor: pointer;
        clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px), 0 12px); }
      #landing .tag::before, #hand-pick::before { content: ''; position: absolute; left: 12px; top: 50%; width: 8px; height: 8px; margin-top: -4px;
        border-radius: 50%; background: var(--felt); box-shadow: 0 0 0 2px var(--tomato); }
      #landing .tag[aria-checked='true'], #landing .tag[aria-pressed='true'] { background: var(--mustard); }
      /* the tag shape clips outlines, so focus is drawn inside it */
      #landing .tag:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--tomato); }
      #hand-pick { display: flex; gap: 6px; align-items: center; cursor: default; }
      #hand-pick .lbl { margin-right: 2px; }
      #hand-pick button { font: inherit; padding: 4px 10px; border-radius: 8px; border: 1.5px solid #3b2a2033; background: transparent; color: var(--ink); cursor: pointer; }
      #hand-pick button[aria-checked='true'] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
      #hand-pick button:focus-visible { outline: 3px solid var(--tomato); outline-offset: 1px; }

      /* play together: a paper card pegged to the felt, with the caller's phone beside it */
      #coop { position: relative; display: grid; grid-template-columns: 170px 1fr; gap: 26px; align-items: center; background: var(--paper); color: var(--ink);
        border-radius: 4px; padding: 26px 28px 22px; box-shadow: 0 5px 0 #0003; max-width: 820px; width: 100%; align-self: center; transform: rotate(-.4deg); }
      #coop .phone { padding: 6px; transform: rotate(-3deg); margin: -44px 0 -10px; }
      #coop .phone img { border-radius: 14px; }
      #coop h2 { margin: 0 0 8px; font: 400 25px/1.15 var(--display); color: var(--walnut); }
      #coop p { margin: 0 0 12px; max-width: 58ch; font: 600 15px/1.55 var(--serif); }
      #coop .row { margin: 6px 0 10px; }
      #coop-code { width: 6.5em; text-align: center; text-transform: uppercase; letter-spacing: .2em; font: 600 17px system-ui, sans-serif;
        padding: 9px 10px; border-radius: 12px; border: 2px solid var(--walnut); background: #fff; color: var(--ink); }
      #coop-status { min-height: 1.4em; font-weight: 700; color: var(--walnut); margin: 0 !important; }
      #coop .fine { font: 600 13px/1.5 var(--serif); color: #6b5a4e; margin: 6px 0 0; }

      #landing button:focus-visible, #landing input:focus-visible, #landing summary:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }
      @media (min-width: 1200px) { #landing .steps li { font-size: 16px; } }
      @media (max-width: 860px) {
        #landing .hero { grid-template-columns: 1fr; }
        #landing .hero-photo { transform: rotate(1deg); margin-top: 18px; }
        #landing .steps { flex-direction: column; gap: 26px; }
        #landing .steps li { margin-top: 18px !important; max-width: 520px; align-self: center; }
        #landing .yarn { display: none; }
        #landing .more { grid-template-columns: 1fr 1fr; }
        #landing .more p { grid-column: 1 / -1; order: -1; }
      }
      @media (max-width: 520px) {
        #landing { padding: 14px 10px 30px; }
        #landing .frame { padding: 14px; }
        #landing .spool { transform: scale(.72); }
        #landing .mark { gap: 10px; }
        #landing h1 { font-size: clamp(34px, 10.5vw, 52px); }
        #landing .weave { --cell: 8px; }
        #landing .more { grid-template-columns: 1fr; }
        #settings { display: grid; grid-template-columns: 1fr 1fr; }
        #hand-pick { grid-column: 1 / -1; justify-self: center; }
        #landing .tag { justify-content: center; }
        #coop { grid-template-columns: 1fr; padding: 22px 18px; }
        #coop .phone { max-width: 170px; margin: -40px auto 0; }
        #coop .row { display: grid; grid-template-columns: 1fr auto; }
        #coop-host { grid-column: 1 / -1; }
        #coop-code { width: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #landing .cloth i { opacity: 1; transform: none; animation: none !important; }
        #enter-xr { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
